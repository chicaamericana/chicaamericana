<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin | Chica Americana</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 2rem; }
        .panel { background: #2a2a2a; padding: 25px; max-width: 500px; margin: 0 auto; border-radius: 8px; }
        input, select, button { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 4px; border: none; }
        button { background: #2196F3; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Agregar Contenido</h2>
        <select id="tipo"><option value="foto">Foto</option><option value="video">Video</option></select>
        <input type="text" id="url" placeholder="URL de la imagen/video">
        <button id="btn">Publicar en Portafolio</button>
        <p id="msg"></p>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyCd5evRX5lv8ulopShw0gJ_iCpnaMQxays", authDomain: "chica-americana.firebaseapp.com", projectId: "chica-americana", storageBucket: "chica-americana.firebasestorage.app", messagingSenderId: "20615894861", appId: "1:20615894861:web:67895bcdec88371e318904" };
        const db = getFirestore(initializeApp(firebaseConfig));
        document.getElementById('btn').onclick = async () => {
            const url = document.getElementById('url').value;
            await addDoc(collection(db, "multimedia"), { tipo: document.getElementById('tipo').value, url: url });
            document.getElementById('msg').innerText = "¡Contenido publicado!";
        };
    </script>
</body>
</html>
