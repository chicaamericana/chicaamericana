<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Álbum Interactivo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #121212; color: #ffffff; }
        h1, h2 { text-align: center; font-weight: 300; }
        header { padding: 3rem 1rem; background-color: #1e1e1e; border-bottom: 2px solid #333; }
        section { padding: 2rem 5%; }
        .galeria-tabla { width: 100%; border-collapse: separate; border-spacing: 15px; table-layout: fixed; margin-top: 1.5rem; }
        .galeria-tabla td { padding: 0; vertical-align: middle; width: 25%; }
        .item { position: relative; cursor: pointer; overflow: hidden; border-radius: 8px; aspect-ratio: 1 / 1; background-color: #222; width: 100%; }
        .item img, .item video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .item:hover img, .item:hover video { transform: scale(1.05); }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: rgba(255, 255, 255, 0.8); pointer-events: none; }
        #visor-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.65); backdrop-filter: blur(15px); align-items: center; justify-content: center; flex-direction: column; }
        #titulo-album { position: absolute; top: 20px; color: white; font-size: 1.5rem; font-weight: 300; z-index: 1002; }
        #contenido-modal { max-width: 85%; max-height: 80vh; display: flex; justify-content: center; align-items: center; }
        #contenido-modal img, #contenido-modal video { max-width: 100%; max-height: 80vh; border-radius: 8px; }
        .btn-nav { position: absolute; top: 50%; color: white; font-size: 3rem; cursor: pointer; z-index: 1002; padding: 10px 20px; background: rgba(0,0,0,0.3); border-radius: 5px; }
        .btn-prev { left: 2%; } .btn-next { right: 2%; }
        .cerrar-modal { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; z-index: 1002; }
    </style>
</head>
<body>
    <header>
        <h1>Mi Portafolio Visual</h1>
        <p style="text-align: center; color: #aaa;">Explora mi trabajo en fotografía y videografía</p>
    </header>
    <section id="fotos"><h2>Álbum de Fotografías</h2><table class="galeria-tabla" id="tabla-fotos"></table></section>
    <section id="videos"><h2>Galería de Videos</h2><table class="galeria-tabla" id="tabla-videos"></table></section>
    <div id="visor-modal">
        <h2 id="titulo-album"></h2><span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
        <div class="btn-nav btn-prev" onclick="navegar(-1)">&#10094;</div>
        <div class="btn-nav btn-next" onclick="navegar(1)">&#10095;</div>
        <div id="contenido-modal"></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyCd5evRX5lv8ulopShw0gJ_iCpnaMQxays", authDomain: "chica-americana.firebaseapp.com", projectId: "chica-americana", storageBucket: "chica-americana.firebasestorage.app", messagingSenderId: "20615894861", appId: "1:20615894861:web:67895bcdec88371e318904" };
        const db = getFirestore(initializeApp(firebaseConfig));
        let portafolio = { fotos: [], videos: [] };
        onSnapshot(collection(db, "multimedia"), (snapshot) => {
            portafolio.fotos = []; portafolio.videos = [];
            snapshot.forEach((doc) => { const d = doc.data(); if(d.tipo === 'foto') portafolio.fotos.push(d.url); else portafolio.videos.push(d.url); });
            renderizarTablas();
        });
        function renderizarTablas() {
            renderizarSeccion(portafolio.fotos, 'tabla-fotos', 'imagen');
            renderizarSeccion(portafolio.videos, 'tabla-videos', 'video');
        }
        function renderizarSeccion(arrayDatos, idTabla, tipo) {
            const tabla = document.getElementById(idTabla); tabla.innerHTML = ''; let tr;
            arrayDatos.forEach((url, i) => {
                if(i % 4 === 0) { tr = document.createElement('tr'); tabla.appendChild(tr); }
                const td = document.createElement('td');
                td.innerHTML = `<div class="item" onclick="abrirModal('${tipo}', ${i})">${tipo==='imagen'?`<img src="${url}">`:`<video src="${url}"></video><div class="play-icon">▶</div>`}</div>`;
                tr.appendChild(td);
            });
        }
        window.abrirModal = (tipo, i) => {
            document.getElementById('visor-modal').style.display = 'flex';
            const url = (tipo === 'imagen' ? portafolio.fotos : portafolio.videos)[i];
            document.getElementById('contenido-modal').innerHTML = tipo==='imagen'?`<img src="${url}">`:`<video src="${url}" controls autoplay></video>`;
        };
        window.cerrarModal = () => document.getElementById('visor-modal').style.display = 'none';
    </script>
</body>
</html>
