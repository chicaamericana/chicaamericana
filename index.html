<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chica Americana</title>
    <!-- HLS.js para archivos m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js para archivos dash / mpd -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f10;
            --card-bg: #1a1a1e;
            --card-hover: #26262b;
            --accent-color: #0095f6;
            --accent-hover: #1877f2;
            --text-color: #f5f5f7;
            --text-muted: #a1a1a6;
            --border-color: #2d2d32;
            --radius-lg: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Buscador superior */
        .buscador-container { 
            padding: 1.5rem 1rem 0.5rem 1rem; 
            max-width: 935px; 
            margin: 0 auto; 
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            pointer-events: none;
        }

        #input-buscador { 
            width: 100%; 
            padding: 12px 16px 12px 42px; 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-lg); 
            color: var(--text-color); 
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.2s ease; 
        }

        #input-buscador:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px rgba(0, 149, 246, 0.15);
        }

        section { 
            padding: 1.25rem 1rem; 
            max-width: 935px; 
            margin: 0 auto; 
        }

        h2 { 
            font-weight: 600; 
            font-size: 1.1rem; 
            margin-bottom: 14px; 
            letter-spacing: 0.5px; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Cuadrícula adaptable */
        .grid-galeria { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            width: 100%; 
        }

        @media (max-width: 600px) {
            .grid-galeria {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        
        .item { 
            position: relative; 
            cursor: pointer; 
            overflow: hidden; 
            aspect-ratio: 1 / 1; 
            background-color: var(--card-bg); 
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        
        .item img, .item video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s ease, opacity 0.2s ease; 
        }
        
        .item:hover img, .item:hover video { 
            transform: scale(1.04);
            opacity: 0.9; 
        }
        
        .play-icon { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff; 
            pointer-events: none; 
            z-index: 2; 
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .item:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.1);
            background: var(--accent-color);
        }
        
        .item-label { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%); 
            font-size: 0.85rem; 
            padding: 20px 10px 10px 10px; 
            box-sizing: border-box; 
            text-align: center; 
            font-weight: 500; 
            z-index: 2; 
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .item:hover .item-label { 
            opacity: 1; 
        }

        /* Tarjeta de "Ver más" */
        .item-ver-mas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            aspect-ratio: 1 / 1;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            text-align: center;
            padding: 10px;
        }

        .item-ver-mas:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .item-ver-mas span {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 8px;
        }

        .item-ver-mas svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-color);
            transition: transform 0.2s ease;
        }

        .item-ver-mas:hover svg {
            transform: scale(1.1);
        }

        /* Cabecera de vistas secundarias */
        .header-vista { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            margin-bottom: 20px; 
        }

        .btn-volver { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            font-size: 0.9rem; 
            cursor: pointer; 
            font-weight: 500; 
            padding: 8px 14px; 
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-volver:hover { 
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Estilos del Modal */
        #visor-modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.94); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
        }
        
        #titulo-album { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: white; 
            font-size: 1rem; 
            font-weight: 500; 
            letter-spacing: 0.5px; 
            margin: 0; 
            z-index: 1002; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
            width: 80%; 
            text-align: center; 
        }
        
        #contenedor-modal { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            max-width: 90%; 
            max-height: 80vh; 
            width: 100%;
            transition: opacity 0.3s ease; 
        }
        
        #contenido-modal { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            max-height: 70vh; 
            width: 100%; 
            overflow: hidden; 
            position: relative; 
            border-radius: var(--radius-sm); 
        }
        
        #contenido-modal img { 
            max-width: 100%; 
            max-height: 70vh; 
            border-radius: var(--radius-sm); 
            user-select: none; 
            transition: transform 0.2s ease; 
            transform-origin: center center; 
            cursor: zoom-in; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        #contenido-modal img.zoom-activado { 
            transform: scale(2); 
            cursor: zoom-out; 
        }

        #contenido-modal video, #contenido-modal iframe { 
            max-width: 100%; 
            max-height: 70vh; 
            border-radius: var(--radius-sm); 
            user-select: none; 
            width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        #contenido-modal iframe { 
            aspect-ratio: 16/9; 
            border: none; 
        }

        .enlace-alternativo { 
            display: none; 
            margin-top: 15px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
        
        .enlace-alternativo p { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            margin: 0 0 8px 0; 
        }
        
        .input-copiar-grupo { 
            display: flex; 
            gap: 8px; 
        }
        
        .input-copiar-grupo input { 
            flex-grow: 1; 
            padding: 8px 12px; 
            background: #101012; 
            border: 1px solid var(--border-color); 
            color: #fff; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            outline: none; 
        }
        
        .input-copiar-grupo button { 
            padding: 8px 16px; 
            background: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem; 
            transition: background 0.2s ease; 
        }
        
        .input-copiar-grupo button:hover { 
            background: var(--accent-hover); 
        }

        .btn-nav { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            color: white; 
            cursor: pointer; 
            z-index: 1002; 
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(4px);
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease; 
            user-select: none; 
        }
        
        .btn-nav:hover { 
            background: rgba(255,255,255,0.25); 
            transform: translateY(-50%) scale(1.05);
        }

        .btn-nav svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        
        .btn-prev { left: 20px; } 
        .btn-next { right: 20px; }

        .cerrar-modal { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: #fff; 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer; 
            z-index: 1002; 
            transition: background 0.2s ease; 
        }

        .cerrar-modal svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .cerrar-modal:hover { 
            background: rgba(255, 68, 68, 0.8); 
        }
    </style>
</head>
<body>

    <!-- BUSCADOR SUPERIOR -->
    <div class="buscador-container">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="input-buscador" placeholder="Buscar álbumes o videos..." oninput="manejarBusqueda()">
        </div>
    </div>

    <!-- VISTA PRINCIPAL -->
    <div id="vista-principal">
        <section>
            <h2>Álbumes</h2>
            <div class="grid-galeria" id="grid-fotos-home"></div>
        </section>

        <section>
            <h2>Videos</h2>
            <div class="grid-galeria" id="grid-videos-home"></div>
        </section>
    </div>

    <!-- VISTA TODOS LOS ÁLBUMES -->
    <div id="vista-todos-fotos" style="display: none;">
        <section>
            <div class="header-vista">
                <button class="btn-volver" onclick="irAVista('principal')">&#10094; Volver al inicio</button>
                <h2 style="margin-bottom: 0;">Álbumes de Fotografías</h2>
            </div>
            <div class="grid-galeria" id="grid-fotos-full"></div>
        </section>
    </div>

    <!-- VISTA TODOS LOS VIDEOS -->
    <div id="vista-todos-videos" style="display: none;">
        <section>
            <div class="header-vista">
                <button class="btn-volver" onclick="irAVista('principal')">&#10094; Volver al inicio</button>
                <h2 style="margin-bottom: 0;">Todos los Videos</h2>
            </div>
            <div class="grid-galeria" id="grid-videos-full"></div>
        </section>
    </div>

    <!-- VISTA DE RESULTADOS DE BÚSQUEDA -->
    <div id="vista-busqueda" style="display: none;">
        <section>
            <div class="header-vista">
                <button class="btn-volver" onclick="irAVista('principal')">&#10094; Volver al inicio</button>
                <h2 style="margin-bottom: 0;">Resultados de Búsqueda</h2>
            </div>
            <h3 style="color: var(--accent-color); font-size: 0.95rem; margin: 15px 0 10px 0;">Álbumes de Fotos</h3>
            <div class="grid-galeria" id="grid-busqueda-fotos"></div>
            
            <h3 style="color: var(--accent-color); font-size: 0.95rem; margin: 25px 0 10px 0;">Videos</h3>
            <div class="grid-galeria" id="grid-busqueda-videos"></div>
        </section>
    </div>

    <!-- VENTANA MODAL -->
    <div id="visor-modal">
        <h2 id="titulo-album">Nombre del Álbum</h2>
        <div class="cerrar-modal" onclick="cerrarModal()">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
        <div class="btn-nav btn-prev" id="btn-modal-prev" onclick="navegar(-1)">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </div>
        <div class="btn-nav btn-next" id="btn-modal-next" onclick="navegar(1)">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>
        
        <div id="contenedor-modal">
            <div id="contenido-modal"></div>
            <div class="enlace-alternativo" id="caja-enlace-video">
                <p>¿Problemas para visualizar el video? Copia el enlace directo:</p>
                <div class="input-copiar-grupo">
                    <input type="text" id="input-url-video" readonly>
                    <button id="btn-copiar-url" onclick="copiarEnlaceVideo()">Copiar enlace</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCd5evRX5lv8ulopShw0gJ_iCpnaMQxays", 
            authDomain: "chica-americana.firebaseapp.com", 
            projectId: "chica-americana", 
            storageBucket: "chica-americana.firebasestorage.app", 
            messagingSenderId: "20615894861", 
            appId: "1:20615894861:web:67895bcdec88371e318904" 
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        let albumesFotos = []; 
        let listaVideos = [];  
        let vistaActual = 'principal';

        onSnapshot(collection(db, "multimedia"), (snapshot) => {
            albumesFotos = [];
            listaVideos = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                const nombreItem = data.nombre || "Sin título";

                if (data.tipo === 'foto') {
                    let urlsArray = [];
                    if (Array.isArray(data.url)) {
                        urlsArray = data.url;
                    } else if (typeof data.url === 'string') {
                        urlsArray = [data.url];
                    }

                    if (urlsArray.length > 0) {
                        albumesFotos.push({
                            id: doc.id,
                            nombre: nombreItem,
                            portada: urlsArray[0], 
                            fotos: urlsArray       
                        });
                    }
                } else if (data.tipo === 'video') {
                    listaVideos.push({
                        id: doc.id,
                        nombre: nombreItem,
                        url: data.url,
                        portada: data.portada || "" 
                    });
                }
            });

            albumesFotos.reverse();
            listaVideos.reverse();

            actualizarVistas();
        });

        window.irAVista = function(vista) {
            vistaActual = vista;
            document.getElementById('vista-principal').style.display = (vista === 'principal') ? 'block' : 'none';
            document.getElementById('vista-todos-fotos').style.display = (vista === 'fotos') ? 'block' : 'none';
            document.getElementById('vista-todos-videos').style.display = (vista === 'videos') ? 'block' : 'none';
            document.getElementById('vista-busqueda').style.display = (vista === 'busqueda') ? 'block' : 'none';
            
            if (vista !== 'busqueda') {
                document.getElementById('input-buscador').value = '';
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            actualizarVistas();
        }

        window.manejarBusqueda = function() {
            const query = document.getElementById('input-buscador').value.toLowerCase().trim();
            
            if (query === '') {
                if (vistaActual === 'busqueda') {
                    irAVista('principal');
                } else {
                    actualizarVistas();
                }
                return;
            }

            if (vistaActual !== 'busqueda') {
                vistaActual = 'busqueda';
                document.getElementById('vista-principal').style.display = 'none';
                document.getElementById('vista-todos-fotos').style.display = 'none';
                document.getElementById('vista-todos-videos').style.display = 'none';
                document.getElementById('vista-busqueda').style.display = 'block';
            }

            const fotosFiltradas = albumesFotos.filter(album => album.nombre.toLowerCase().includes(query));
            const videosFiltrados = listaVideos.filter(video => video.nombre.toLowerCase().includes(query));

            renderizarGridResultados(fotosFiltradas, 'grid-busqueda-fotos', 'foto');
            renderizarGridResultados(videosFiltrados, 'grid-busqueda-videos', 'video');
        }

        function actualizarVistas() {
            if (vistaActual === 'principal') {
                renderizarGridHomeAlbumes(albumesFotos, 'grid-fotos-home');
                renderizarGridHomeVideos(listaVideos, 'grid-videos-home');
            } else if (vistaActual === 'fotos') {
                renderizarGridFullAlbumes(albumesFotos, 'grid-fotos-full');
            } else if (vistaActual === 'videos') {
                renderizarGridFullVideos(listaVideos, 'grid-videos-full');
            }
        }

        function renderizarGridHomeAlbumes(array, idGrid) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = ''; 

            const elementosAMostrar = array.slice(0, 8);
            
            elementosAMostrar.forEach((album) => {
                const originalIndex = albumesFotos.indexOf(album);
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = () => abrirAlbumFotos(originalIndex);

                div.innerHTML = `
                    <img src="${album.portada}" alt="${album.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1e/ffffff?text=Error'">
                    <div class="item-label">${album.nombre}</div>`;
                grid.appendChild(div);
            });

            if (array.length > 8) {
                const btnVerMas = document.createElement('div');
                btnVerMas.className = 'item-ver-mas';
                btnVerMas.onclick = () => irAVista('fotos');
                btnVerMas.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span>Ver más (${array.length - 8})</span>`;
                grid.appendChild(btnVerMas);
            }
        }

        function renderizarGridHomeVideos(array, idGrid) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = ''; 

            const elementosAMostrar = array.slice(0, 8);

            elementosAMostrar.forEach((video) => {
                const originalIndex = listaVideos.indexOf(video);
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = () => abrirVideo(originalIndex);

                let contenidoMiniatura = '';
                if (video.portada && video.portada.trim() !== '') {
                    contenidoMiniatura = `<img src="${video.portada}" alt="${video.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1e/ffffff?text=Error'">`;
                } else {
                    contenidoMiniatura = `
                        <video preload="metadata" muted playsinline>
                            <source src="${video.url}">
                        </video>`;
                }

                div.innerHTML = `
                    ${contenidoMiniatura}
                    <div class="play-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="item-label">${video.nombre}</div>`;
                grid.appendChild(div);
            });

            if (array.length > 8) {
                const btnVerMas = document.createElement('div');
                btnVerMas.className = 'item-ver-mas';
                btnVerMas.onclick = () => irAVista('videos');
                btnVerMas.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span>Ver más (${array.length - 8})</span>`;
                grid.appendChild(btnVerMas);
            }
        }

        function renderizarGridFullAlbumes(array, idGrid) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = ''; 
            array.forEach((album) => {
                const originalIndex = albumesFotos.indexOf(album);
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = () => abrirAlbumFotos(originalIndex);
                div.innerHTML = `
                    <img src="${album.portada}" alt="${album.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1e/ffffff?text=Error'">
                    <div class="item-label">${album.nombre}</div>`;
                grid.appendChild(div);
            });
        }

        function renderizarGridFullVideos(array, idGrid) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = ''; 
            array.forEach((video) => {
                const originalIndex = listaVideos.indexOf(video);
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = () => abrirVideo(originalIndex);

                let contenidoMiniatura = '';
                if (video.portada && video.portada.trim() !== '') {
                    contenidoMiniatura = `<img src="${video.portada}" alt="${video.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1e/ffffff?text=Error'">`;
                } else {
                    contenidoMiniatura = `
                        <video preload="metadata" muted playsinline>
                            <source src="${video.url}">
                        </video>`;
                }

                div.innerHTML = `
                    ${contenidoMiniatura}
                    <div class="play-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="item-label">${video.nombre}</div>`;
                grid.appendChild(div);
            });
        }

        function renderizarGridResultados(array, idGrid, tipo) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = '';

            if (array.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem; grid-column: 1 / -1; text-align: center; padding: 20px 0;">No se encontraron resultados.</p>`;
                return;
            }

            array.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'item';
                
                if (tipo === 'foto') {
                    const originalIndex = albumesFotos.indexOf(item);
                    div.onclick = () => abrirAlbumFotos(originalIndex);
                    div.innerHTML = `
                        <img src="${item.portada}" alt="${item.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1e/ffffff?text=Error'">
                        <div class="item-label">${item.nombre}</div>`;
                } else {
                    const originalIndex = listaVideos.indexOf(item);
                    div.onclick = () => abrirVideo(originalIndex);
                    let contenidoMiniatura = '';
                    if (item.portada && item.portada.trim() !== '') {
                        contenidoMiniatura = `<img src="${item.portada}" alt="${item.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1e/ffffff?text=Error'">`;
                    } else {
                        contenidoMiniatura = `
                            <video preload="metadata" muted playsinline>
                                <source src="${item.url}">
                            </video>`;
                    }
                    div.innerHTML = `
                        ${contenidoMiniatura}
                        <div class="play-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="item-label">${item.nombre}</div>`;
                }
                grid.appendChild(div);
            });
        }

        const modal = document.getElementById('visor-modal');
        const contenidoModal = document.getElementById('contenido-modal');
        const tituloAlbum = document.getElementById('titulo-album');
        const cajaEnlaceVideo = document.getElementById('caja-enlace-video');
        const inputUrlVideo = document.getElementById('input-url-video');
        const btnModalPrev = document.getElementById('btn-modal-prev');
        const btnModalNext = document.getElementById('btn-modal-next');
        
        let indiceActual = 0;
        let arrayActualModal = [];
        let tituloActualModal = '';
        let tipoModalActual = '';
        let hlsInstance = null;
        let dashInstance = null;

        window.abrirAlbumFotos = function(indexAlbum) {
            tipoModalActual = 'foto';
            const albumSeleccionado = albumesFotos[indexAlbum];
            arrayActualModal = albumSeleccionado.fotos;
            tituloActualModal = albumSeleccionado.nombre;
            indiceActual = 0;

            cajaEnlaceVideo.style.display = 'none';
            modal.style.display = 'flex';
            actualizarBotonesNavegacion();
            mostrarItemActual();
        }

        window.abrirVideo = function(indexVideo) {
            tipoModalActual = 'video';
            const videoSeleccionado = listaVideos[indexVideo];
            arrayActualModal = [videoSeleccionado.url];
            tituloActualModal = videoSeleccionado.nombre;
            indiceActual = 0;

            inputUrlVideo.value = videoSeleccionado.url;
            cajaEnlaceVideo.style.display = 'block';
            modal.style.display = 'flex';
            actualizarBotonesNavegacion();
            mostrarItemActual();
        }

        function actualizarBotonesNavegacion() {
            if (arrayActualModal.length <= 1) {
                btnModalPrev.style.display = 'none';
                btnModalNext.style.display = 'none';
            } else {
                btnModalPrev.style.display = 'flex';
                btnModalNext.style.display = 'flex';
            }
        }

        function limpiarReproductoresPrevios() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (dashInstance) {
                dashInstance.reset();
                dashInstance = null;
            }
        }

        function mostrarItemActual() {
            limpiarReproductoresPrevios();
            contenidoModal.style.opacity = 0;
            
            setTimeout(() => {
                contenidoModal.innerHTML = '';
                const urlActual = arrayActualModal[indiceActual];

                if (tipoModalActual === 'foto' && arrayActualModal.length > 1) {
                    tituloAlbum.innerText = `${tituloActualModal} (${indiceActual + 1} / ${arrayActualModal.length})`;
                } else {
                    tituloAlbum.innerText = tituloActualModal;
                }

                if (tipoModalActual === 'foto') {
                    const img = document.createElement('img');
                    img.src = urlActual;
                    
                    img.addEventListener('dblclick', function() {
                        this.classList.toggle('zoom-activado');
                        if(!this.classList.contains('zoom-activado')) {
                            this.style.transform = 'scale(1)';
                        }
                    });

                    let isDragging = false;
                    let startX, startY, translateX = 0, translateY = 0;

                    img.addEventListener('mousedown', (e) => {
                        if (img.classList.contains('zoom-activado')) {
                            isDragging = true;
                            startX = e.clientX - translateX;
                            startY = e.clientY - translateY;
                            e.preventDefault();
                        }
                    });

                    window.addEventListener('mousemove', (e) => {
                        if (!isDragging) return;
                        translateX = e.clientX - startX;
                        translateY = e.clientY - startY;
                        img.style.transform = `scale(2) translate(${translateX / 2}px, ${translateY / 2}px)`;
                    });

                    window.addEventListener('mouseup', () => {
                        isDragging = false;
                    });

                    contenidoModal.appendChild(img);
                } else {
                    const urlLower = urlActual.toLowerCase();

                    if (urlLower.includes('youtube.com') || urlLower.includes('youtu.be') || urlLower.includes('vimeo.com')) {
                        let embedUrl = urlActual;
                        if (urlLower.includes('youtu.be/')) {
                            const id = urlActual.split('youtu.be/')[1].split('?')[0];
                            embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1`;
                        } else if (urlLower.includes('watch?v=')) {
                            const id = urlActual.split('watch?v=')[1].split('&')[0];
                            embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1`;
                        }
                        const iframe = document.createElement('iframe');
                        iframe.src = embedUrl;
                        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                        iframe.allowFullscreen = true;
                        contenidoModal.appendChild(iframe);
                    } else {
                        const video = document.createElement('video');
                        video.controls = true;
                        video.autoplay = true;
                        video.playsInline = true;

                        if (urlLower.endsWith('.m3u8')) {
                            if (Hls.isSupported()) {
                                hlsInstance = new Hls();
                                hlsInstance.loadSource(urlActual);
                                hlsInstance.attachMedia(video);
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = urlActual;
                            }
                        } else if (urlLower.endsWith('.mpd')) {
                            if (typeof dashjs !== 'undefined') {
                                dashInstance = dashjs.MediaPlayer().create();
                                dashInstance.initialize(video, urlActual, true);
                            }
                        } else {
                            const source = document.createElement('source');
                            source.src = urlActual;
                            video.appendChild(source);
                        }

                        contenidoModal.appendChild(video);
                    }
                }
                
                contenidoModal.style.opacity = 1;
            }, 150);
        }

        window.copiarEnlaceVideo = function() {
            inputUrlVideo.select();
            inputUrlVideo.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputUrlVideo.value).then(() => {
                const btn = document.getElementById('btn-copiar-url');
                const textoOriginal = btn.innerText;
                btn.innerText = "¡Copiado! ✓";
                btn.style.background = "#22c55e";
                setTimeout(() => {
                    btn.innerText = textoOriginal;
                    btn.style.background = "var(--accent-color)";
                }, 2000);
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        window.navegar = function(direccion) {
            if (arrayActualModal.length <= 1) return; 
            indiceActual += direccion;
            if (indiceActual >= arrayActualModal.length) indiceActual = 0;
            if (indiceActual < 0) indiceActual = arrayActualModal.length - 1;
            mostrarItemActual();
        }

        window.cerrarModal = function() {
            limpiarReproductoresPrevios();
            modal.style.display = 'none';
            contenidoModal.innerHTML = ''; 
            cajaEnlaceVideo.style.display = 'none';
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal || e.target === tituloAlbum) cerrarModal();
        });

        document.addEventListener('keydown', function(event) {
            if (modal.style.display === 'flex') {
                if (event.key === "Escape") cerrarModal();
                if (event.key === "ArrowRight") navegar(1);
                if (event.key === "ArrowLeft") navegar(-1);
            }
        });

        let touchstartX = 0;
        let touchendX = 0;

        document.getElementById('contenedor-modal').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('contenedor-modal').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            manejarSwipe();
        }, { passive: true });

        function manejarSwipe() {
            if (tipoModalActual === 'foto') {
                if (touchendX < touchstartX - 50) navegar(1);  
                if (touchendX > touchstartX + 50) navegar(-1); 
            }
        }
    </script>
</body>
</html>
