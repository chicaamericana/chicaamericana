<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Álbum Interactivo</title>
    <!-- HLS.js para reproducción de archivos m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #121212; color: #ffffff; }
        h2 { text-align: center; font-weight: 300; }
        section { padding: 2rem 5%; }
        
        .galeria-tabla { width: 100%; border-collapse: separate; border-spacing: 15px; table-layout: fixed; margin-top: 1.5rem; }
        .galeria-tabla td { padding: 0; vertical-align: middle; width: 25%; }
        
        .item { position: relative; cursor: pointer; overflow: hidden; border-radius: 8px; aspect-ratio: 1 / 1; background-color: #222; width: 100%; }
        .item img, .item video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .item:hover img, .item:hover video { transform: scale(1.05); }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: rgba(255, 255, 255, 0.8); pointer-events: none; z-index: 2; }
        
        .item-label { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.75); font-size: 0.85rem; padding: 8px; box-sizing: border-box; text-align: center; font-weight: 500; z-index: 2; }

        #visor-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); align-items: center; justify-content: center; flex-direction: column; }
        #titulo-album { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; margin: 0; z-index: 1002; text-shadow: 0 2px 4px rgba(0,0,0,0.8); width: 80%; text-align: center; }
        
        #contenedor-modal { display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 85%; max-height: 80vh; transition: opacity 0.3s ease; }
        #contenido-modal { display: flex; justify-content: center; align-items: center; max-height: 70vh; }
        #contenido-modal img, #contenido-modal video { max-width: 100%; max-height: 70vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); user-select: none; }

        /* Contenedor del enlace alternativo visible solo en videos */
        .enlace-alternativo { display: none; margin-top: 12px; width: 100%; max-width: 500px; text-align: center; }
        .enlace-alternativo p { font-size: 0.8rem; color: #aaa; margin: 0 0 5px 0; }
        .input-copiar-grupo { display: flex; gap: 8px; }
        .input-copiar-grupo input { flex-grow: 1; padding: 8px 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.85rem; outline: none; }
        .input-copiar-grupo button { padding: 8px 15px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: background 0.2s; }
        .input-copiar-grupo button:hover { background: #0b7dda; }

        .btn-nav { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 3rem; cursor: pointer; z-index: 1002; padding: 10px 20px; background: rgba(0,0,0,0.3); border-radius: 5px; transition: background 0.3s, transform 0.2s; user-select: none; }
        .btn-nav:hover { background: rgba(0,0,0,0.8); transform: translateY(-50%) scale(1.1); }
        .btn-prev { left: 2%; } 
        .btn-next { right: 2%; }

        .cerrar-modal { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1002; transition: color 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .cerrar-modal:hover { color: #ff4444; }
    </style>
</head>
<body>

    <section id="fotos" style="padding-top: 3rem;">
        <h2>Álbumes de Fotografías</h2>
        <table class="galeria-tabla" id="tabla-fotos"></table>
    </section>

    <section id="videos">
        <h2>Galería de Videos</h2>
        <table class="galeria-tabla" id="tabla-videos"></table>
    </section>

    <div id="visor-modal">
        <h2 id="titulo-album">Nombre del Álbum</h2>
        <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
        <div class="btn-nav btn-prev" onclick="navegar(-1)">&#10094;</div>
        <div class="btn-nav btn-next" onclick="navegar(1)">&#10095;</div>
        
        <div id="contenedor-modal">
            <div id="contenido-modal"></div>
            <!-- Cuadro de texto exclusivo para videos cuando están abiertos en el modal -->
            <div class="enlace-alternativo" id="caja-enlace-video">
                <p>¿Problemas para visualizar el video? Copia el enlace y ábrelo externamente:</p>
                <div class="input-copiar-grupo">
                    <input type="text" id="input-url-video" readonly>
                    <button onclick="copiarEnlaceVideo()">Copiar enlace</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCd5evRX5lv8ulopShw0gJ_iCpnaMQxays", authDomain: "chica-americana.firebaseapp.com", projectId: "chica-americana", storageBucket: "chica-americana.firebasestorage.app", messagingSenderId: "20615894861", appId: "1:20615894861:web:67895bcdec88371e318904" };
        const db = getFirestore(initializeApp(firebaseConfig));

        let albumesFotos = []; 
        let listaVideos = [];  

        onSnapshot(collection(db, "multimedia"), (snapshot) => {
            albumesFotos = [];
            listaVideos = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                const nombreItem = data.nombre || "Sin título";

                if (data.tipo === 'foto') {
                    let urlsArray = [];
                    if (Array.isArray(data.url)) {
                        urlsArray = data.url;
                    } else if (typeof data.url === 'string') {
                        urlsArray = [data.url];
                    }

                    if (urlsArray.length > 0) {
                        albumesFotos.push({
                            nombre: nombreItem,
                            portada: urlsArray[0], 
                            fotos: urlsArray       
                        });
                    }
                } else if (data.tipo === 'video') {
                    listaVideos.push({
                        nombre: nombreItem,
                        url: data.url
                    });
                }
            });

            renderizarTablas();
        });

        function renderizarTablas() {
            renderizarSeccionAlbumes(albumesFotos, 'tabla-fotos');
            renderizarSeccionVideos(listaVideos, 'tabla-videos');
        }

        function renderizarSeccionAlbumes(arrayAlbumes, idTabla) {
            const tabla = document.getElementById(idTabla);
            tabla.innerHTML = ''; 
            let tr = null;

            for (let i = 0; i < arrayAlbumes.length; i++) {
                if (i % 4 === 0) {
                    tr = document.createElement('tr');
                    tabla.appendChild(tr);
                }
                const td = document.createElement('td');
                const album = arrayAlbumes[i];

                let contenidoHtml = `
                    <div class="item" onclick="abrirAlbumFotos(${i})">
                        <img src="${album.portada}" alt="${album.nombre}" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                        <div class="item-label">${album.nombre}</div>
                    </div>`;
                
                td.innerHTML = contenidoHtml;
                tr.appendChild(td);
            }

            if (arrayAlbumes.length % 4 !== 0) {
                let faltantes = 4 - (arrayAlbumes.length % 4);
                for (let j = 0; j < faltantes; j++) {
                    tr.appendChild(document.createElement('td'));
                }
            }
        }

        function renderizarSeccionVideos(arrayVideos, idTabla) {
            const tabla = document.getElementById(idTabla);
            tabla.innerHTML = ''; 
            let tr = null;

            for (let i = 0; i < arrayVideos.length; i++) {
                if (i % 4 === 0) {
                    tr = document.createElement('tr');
                    tabla.appendChild(tr);
                }
                const td = document.createElement('td');
                const video = arrayVideos[i];

                let contenidoHtml = `
                    <div class="item" onclick="abrirVideo(${i})">
                        <video preload="metadata" muted playsinline>
                            <source src="${video.url}">
                            Tu navegador no soporta videos.
                        </video>
                        <div class="play-icon">▶</div>
                        <div class="item-label">${video.nombre}</div>
                    </div>`;
                
                td.innerHTML = contenidoHtml;
                tr.appendChild(td);
            }

            if (arrayVideos.length % 4 !== 0) {
                let faltantes = 4 - (arrayVideos.length % 4);
                for (let j = 0; j < faltantes; j++) {
                    tr.appendChild(document.createElement('td'));
                }
            }
        }

        const modal = document.getElementById('visor-modal');
        const contenidoModal = document.getElementById('contenido-modal');
        const tituloAlbum = document.getElementById('titulo-album');
        const cajaEnlaceVideo = document.getElementById('caja-enlace-video');
        const inputUrlVideo = document.getElementById('input-url-video');
        
        let indiceActual = 0;
        let arrayActualModal = [];
        let tituloActualModal = '';
        let tipoModalActual = '';
        let hlsInstance = null;

        window.abrirAlbumFotos = function(indexAlbum) {
            tipoModalActual = 'foto';
            const albumSeleccionado = albumesFotos[indexAlbum];
            arrayActualModal = albumSeleccionado.fotos;
            tituloActualModal = albumSeleccionado.nombre;
            indiceActual = 0;

            cajaEnlaceVideo.style.display = 'none'; // Ocultar cuadro de enlace si es foto
            modal.style.display = 'flex';
            mostrarItemActual();
        }

        window.abrirVideo = function(indexVideo) {
            tipoModalActual = 'video';
            const videoSeleccionado = listaVideos[indexVideo];
            arrayActualModal = [videoSeleccionado.url];
            tituloActualModal = videoSeleccionado.nombre;
            indiceActual = 0;

            inputUrlVideo.value = videoSeleccionado.url; // Llenar el input con el enlace del video
            cajaEnlaceVideo.style.display = 'block';     // Mostrar cuadro de enlace alternativo
            modal.style.display = 'flex';
            mostrarItemActual();
        }

        function mostrarItemActual() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            contenidoModal.style.opacity = 0;
            
            setTimeout(() => {
                contenidoModal.innerHTML = '';
                const urlActual = arrayActualModal[indiceActual];

                if (tipoModalActual === 'foto' && arrayActualModal.length > 1) {
                    tituloAlbum.innerText = `${tituloActualModal} (${indiceActual + 1} / ${arrayActualModal.length})`;
                } else {
                    tituloAlbum.innerText = tituloActualModal;
                }

                if (tipoModalActual === 'foto') {
                    const img = document.createElement('img');
                    img.src = urlActual;
                    contenidoModal.appendChild(img);
                } else {
                    const video = document.createElement('video');
                    video.controls = true;
                    video.autoplay = true;
                    video.playsInline = true;

                    if (urlActual.includes('.m3u8')) {
                        if (Hls.isSupported()) {
                            hlsInstance = new Hls();
                            hlsInstance.loadSource(urlActual);
                            hlsInstance.attachMedia(video);
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = urlActual;
                        }
                    } else {
                        const source = document.createElement('source');
                        source.src = urlActual;
                        video.appendChild(source);
                    }

                    contenidoModal.appendChild(video);
                }
                
                contenidoModal.style.opacity = 1;
            }, 150);
        }

        window.copiarEnlaceVideo = function() {
            inputUrlVideo.select();
            inputUrlVideo.setSelectionRange(0, 99999); // Para dispositivos móviles
            navigator.clipboard.writeText(inputUrlVideo.value).then(() => {
                alert("¡Enlace copiado al portapapeles!");
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        window.navegar = function(direccion) {
            if (arrayActualModal.length <= 1) return; 
            indiceActual += direccion;
            if (indiceActual >= arrayActualModal.length) indiceActual = 0;
            if (indiceActual < 0) indiceActual = arrayActualModal.length - 1;
            mostrarItemActual();
        }

        window.cerrarModal = function() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            modal.style.display = 'none';
            contenidoModal.innerHTML = ''; 
            cajaEnlaceVideo.style.display = 'none';
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal || e.target === tituloAlbum) cerrarModal();
        });

        document.addEventListener('keydown', function(event) {
            if (modal.style.display === 'flex') {
                if (event.key === "Escape") cerrarModal();
                if (event.key === "ArrowRight") navegar(1);
                if (event.key === "ArrowLeft") navegar(-1);
            }
        });

        let touchstartX = 0;
        let touchendX = 0;

        document.getElementById('contenedor-modal').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('contenedor-modal').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            manejarSwipe();
        }, { passive: true });

        function manejarSwipe() {
            if (tipoModalActual === 'foto') {
                if (touchendX < touchstartX - 50) navegar(1);  
                if (touchendX > touchstartX + 50) navegar(-1); 
            }
        }
    </script>
</body>
</html>
