<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Estilo Instagram</title>
    <!-- HLS.js para archivos m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js para archivos dash / mpd -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #000; color: #ffffff; }
        
        section { padding: 1.5rem 5%; max-width: 935px; margin: 0 auto; }
        h2 { font-weight: 600; font-size: 1.1rem; margin-bottom: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: #aaa; }
        
        /* Cuadrícula de 3 columnas estilo Instagram */
        .grid-galeria { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 4px; 
            width: 100%; 
        }
        
        .item { 
            position: relative; 
            cursor: pointer; 
            overflow: hidden; 
            aspect-ratio: 1 / 1; 
            background-color: #1a1a1a; 
        }
        
        .item img, .item video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: opacity 0.2s ease; 
        }
        
        .item:hover img, .item:hover video { 
            opacity: 0.8; 
        }
        
        .play-icon { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 2.5rem; 
            color: rgba(255, 255, 255, 0.9); 
            pointer-events: none; 
            z-index: 2; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        
        .item-label { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
            font-size: 0.8rem; 
            padding: 12px 8px 8px 8px; 
            box-sizing: border-box; 
            text-align: center; 
            font-weight: 500; 
            z-index: 2; 
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .item:hover .item-label { 
            opacity: 1; 
        }

        /* Estilos del Modal */
        #visor-modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.92); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
        }
        
        #titulo-album { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: white; 
            font-size: 1.1rem; 
            font-weight: 400; 
            letter-spacing: 1px; 
            margin: 0; 
            z-index: 1002; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
            width: 80%; 
            text-align: center; 
        }
        
        #contenedor-modal { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            max-width: 90%; 
            max-height: 80vh; 
            transition: opacity 0.3s ease; 
        }
        
        #contenido-modal { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            max-height: 70vh; 
            width: 100%; 
            overflow: hidden; 
            position: relative; 
            border-radius: 4px; 
        }
        
        #contenido-modal img { 
            max-width: 100%; 
            max-height: 70vh; 
            border-radius: 4px; 
            user-select: none; 
            transition: transform 0.2s ease; 
            transform-origin: center center; 
            cursor: zoom-in; 
        }
        
        #contenido-modal img.zoom-activado { 
            transform: scale(2); 
            cursor: zoom-out; 
        }

        #contenido-modal video, #contenido-modal iframe { 
            max-width: 100%; 
            max-height: 70vh; 
            border-radius: 4px; 
            user-select: none; 
            width: 100%; 
        }
        
        #contenido-modal iframe { 
            aspect-ratio: 16/9; 
            border: none; 
        }

        .enlace-alternativo { 
            display: none; 
            margin-top: 15px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }
        
        .enlace-alternativo p { 
            font-size: 0.8rem; 
            color: #aaa; 
            margin: 0 0 5px 0; 
        }
        
        .input-copiar-grupo { 
            display: flex; 
            gap: 8px; 
        }
        
        .input-copiar-grupo input { 
            flex-grow: 1; 
            padding: 8px 12px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 4px; 
            font-size: 0.85rem; 
            outline: none; 
        }
        
        .input-copiar-grupo button { 
            padding: 8px 15px; 
            background: #0095f6; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem; 
            transition: background 0.2s; 
        }
        
        .input-copiar-grupo button:hover { 
            background: #1877f2; 
        }

        .btn-nav { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            color: white; 
            font-size: 2.5rem; 
            cursor: pointer; 
            z-index: 1002; 
            padding: 10px 15px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 50%; 
            transition: background 0.3s; 
            user-select: none; 
        }
        
        .btn-nav:hover { 
            background: rgba(0,0,0,0.8); 
        }
        
        .btn-prev { left: 3%; } 
        .btn-next { right: 3%; }

        .cerrar-modal { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            color: #fff; 
            font-size: 35px; 
            font-weight: 300; 
            cursor: pointer; 
            z-index: 1002; 
            transition: color 0.2s; 
        }
        
        .cerrar-modal:hover { 
            color: #ff4444; 
        }
    </style>
</head>
<body>

    <section id="fotos" style="padding-top: 2rem;">
        <h2>Álbumes</h2>
        <div class="grid-galeria" id="grid-fotos"></div>
    </section>

    <section id="videos">
        <h2>Videos</h2>
        <div class="grid-galeria" id="grid-videos"></div>
    </section>

    <div id="visor-modal">
        <h2 id="titulo-album">Nombre del Álbum</h2>
        <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
        <div class="btn-nav btn-prev" onclick="navegar(-1)">&#10094;</div>
        <div class="btn-nav btn-next" onclick="navegar(1)">&#10095;</div>
        
        <div id="contenedor-modal">
            <div id="contenido-modal"></div>
            <div class="enlace-alternativo" id="caja-enlace-video">
                <p>¿Problemas para visualizar el video? Copia el enlace y ábrelo externamente:</p>
                <div class="input-copiar-grupo">
                    <input type="text" id="input-url-video" readonly>
                    <button onclick="copiarEnlaceVideo()">Copiar enlace</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCd5evRX5lv8ulopShw0gJ_iCpnaMQxays", authDomain: "chica-americana.firebaseapp.com", projectId: "chica-americana", storageBucket: "chica-americana.firebasestorage.app", messagingSenderId: "20615894861", appId: "1:20615894861:web:67895bcdec88371e318904" };
        const db = getFirestore(initializeApp(firebaseConfig));

        let albumesFotos = []; 
        let listaVideos = [];  

        onSnapshot(collection(db, "multimedia"), (snapshot) => {
            albumesFotos = [];
            listaVideos = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                const nombreItem = data.nombre || "Sin título";

                if (data.tipo === 'foto') {
                    let urlsArray = [];
                    if (Array.isArray(data.url)) {
                        urlsArray = data.url;
                    } else if (typeof data.url === 'string') {
                        urlsArray = [data.url];
                    }

                    if (urlsArray.length > 0) {
                        albumesFotos.push({
                            nombre: nombreItem,
                            portada: urlsArray[0], 
                            fotos: urlsArray       
                        });
                    }
                } else if (data.tipo === 'video') {
                    listaVideos.push({
                        nombre: nombreItem,
                        url: data.url,
                        portada: data.portada || "" 
                    });
                }
            });

            renderizarGrids();
        });

        function renderizarGrids() {
            renderizarGridAlbumes(albumesFotos, 'grid-fotos');
            renderizarGridVideos(listaVideos, 'grid-videos');
        }

        function renderizarGridAlbumes(arrayAlbumes, idGrid) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = ''; 

            arrayAlbumes.forEach((album, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = () => abrirAlbumFotos(i);

                div.innerHTML = `
                    <img src="${album.portada}" alt="${album.nombre}" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                    <div class="item-label">${album.nombre}</div>`;
                
                grid.appendChild(div);
            });
        }

        function renderizarGridVideos(arrayVideos, idGrid) {
            const grid = document.getElementById(idGrid);
            grid.innerHTML = ''; 

            arrayVideos.forEach((video, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.onclick = () => abrirVideo(i);

                let contenidoMiniatura = '';
                if (video.portada && video.portada.trim() !== '') {
                    contenidoMiniatura = `<img src="${video.portada}" alt="${video.nombre}" onerror="this.src='https://via.placeholder.com/150?text=Error'">`;
                } else {
                    contenidoMiniatura = `
                        <video preload="metadata" muted playsinline>
                            <source src="${video.url}">
                            Tu navegador no soporta videos.
                        </video>`;
                }

                div.innerHTML = `
                    ${contenidoMiniatura}
                    <div class="play-icon">▶</div>
                    <div class="item-label">${video.nombre}</div>`;
                
                grid.appendChild(div);
            });
        }

        const modal = document.getElementById('visor-modal');
        const contenidoModal = document.getElementById('contenido-modal');
        const tituloAlbum = document.getElementById('titulo-album');
        const cajaEnlaceVideo = document.getElementById('caja-enlace-video');
        const inputUrlVideo = document.getElementById('input-url-video');
        
        let indiceActual = 0;
        let arrayActualModal = [];
        let tituloActualModal = '';
        let tipoModalActual = '';
        let hlsInstance = null;
        let dashInstance = null;

        window.abrirAlbumFotos = function(indexAlbum) {
            tipoModalActual = 'foto';
            const albumSeleccionado = albumesFotos[indexAlbum];
            arrayActualModal = albumSeleccionado.fotos;
            tituloActualModal = albumSeleccionado.nombre;
            indiceActual = 0;

            cajaEnlaceVideo.style.display = 'none';
            modal.style.display = 'flex';
            mostrarItemActual();
        }

        window.abrirVideo = function(indexVideo) {
            tipoModalActual = 'video';
            const videoSeleccionado = listaVideos[indexVideo];
            arrayActualModal = [videoSeleccionado.url];
            tituloActualModal = videoSeleccionado.nombre;
            indiceActual = 0;

            inputUrlVideo.value = videoSeleccionado.url;
            cajaEnlaceVideo.style.display = 'block';
            modal.style.display = 'flex';
            mostrarItemActual();
        }

        function limpiarReproductoresPrevios() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (dashInstance) {
                dashInstance.reset();
                dashInstance = null;
            }
        }

        function mostrarItemActual() {
            limpiarReproductoresPrevios();
            contenidoModal.style.opacity = 0;
            
            setTimeout(() => {
                contenidoModal.innerHTML = '';
                const urlActual = arrayActualModal[indiceActual];

                if (tipoModalActual === 'foto' && arrayActualModal.length > 1) {
                    tituloAlbum.innerText = `${tituloActualModal} (${indiceActual + 1} / ${arrayActualModal.length})`;
                } else {
                    tituloAlbum.innerText = tituloActualModal;
                }

                if (tipoModalActual === 'foto') {
                    const img = document.createElement('img');
                    img.src = urlActual;
                    
                    img.addEventListener('dblclick', function() {
                        this.classList.toggle('zoom-activado');
                        if(!this.classList.contains('zoom-activado')) {
                            this.style.transform = 'scale(1)';
                        }
                    });

                    let isDragging = false;
                    let startX, startY, translateX = 0, translateY = 0;

                    img.addEventListener('mousedown', (e) => {
                        if (img.classList.contains('zoom-activado')) {
                            isDragging = true;
                            startX = e.clientX - translateX;
                            startY = e.clientY - translateY;
                            e.preventDefault();
                        }
                    });

                    window.addEventListener('mousemove', (e) => {
                        if (!isDragging) return;
                        translateX = e.clientX - startX;
                        translateY = e.clientY - startY;
                        img.style.transform = `scale(2) translate(${translateX / 2}px, ${translateY / 2}px)`;
                    });

                    window.addEventListener('mouseup', () => {
                        isDragging = false;
                    });

                    contenidoModal.appendChild(img);
                } else {
                    const urlLower = urlActual.toLowerCase();

                    if (urlLower.includes('youtube.com') || urlLower.includes('youtu.be') || urlLower.includes('vimeo.com')) {
                        let embedUrl = urlActual;
                        if (urlLower.includes('youtu.be/')) {
                            const id = urlActual.split('youtu.be/')[1].split('?')[0];
                            embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1`;
                        } else if (urlLower.includes('watch?v=')) {
                            const id = urlActual.split('watch?v=')[1].split('&')[0];
                            embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1`;
                        }
                        const iframe = document.createElement('iframe');
                        iframe.src = embedUrl;
                        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                        iframe.allowFullscreen = true;
                        contenidoModal.appendChild(iframe);
                    } else {
                        const video = document.createElement('video');
                        video.controls = true;
                        video.autoplay = true;
                        video.playsInline = true;

                        if (urlLower.endsWith('.m3u8')) {
                            if (Hls.isSupported()) {
                                hlsInstance = new Hls();
                                hlsInstance.loadSource(urlActual);
                                hlsInstance.attachMedia(video);
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = urlActual;
                            }
                        } else if (urlLower.endsWith('.mpd')) {
                            if (typeof dashjs !== 'undefined') {
                                dashInstance = dashjs.MediaPlayer().create();
                                dashInstance.initialize(video, urlActual, true);
                            }
                        } else {
                            const source = document.createElement('source');
                            source.src = urlActual;
                            video.appendChild(source);
                        }

                        contenidoModal.appendChild(video);
                    }
                }
                
                contenidoModal.style.opacity = 1;
            }, 150);
        }

        window.copiarEnlaceVideo = function() {
            inputUrlVideo.select();
            inputUrlVideo.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputUrlVideo.value).then(() => {
                alert("¡Enlace copiado al portapapeles!");
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        window.navegar = function(direccion) {
            if (arrayActualModal.length <= 1) return; 
            indiceActual += direccion;
            if (indiceActual >= arrayActualModal.length) indiceActual = 0;
            if (indiceActual < 0) indiceActual = arrayActualModal.length - 1;
            mostrarItemActual();
        }

        window.cerrarModal = function() {
            limpiarReproductoresPrevios();
            modal.style.display = 'none';
            contenidoModal.innerHTML = ''; 
            cajaEnlaceVideo.style.display = 'none';
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal || e.target === tituloAlbum) cerrarModal();
        });

        document.addEventListener('keydown', function(event) {
            if (modal.style.display === 'flex') {
                if (event.key === "Escape") cerrarModal();
                if (event.key === "ArrowRight") navegar(1);
                if (event.key === "ArrowLeft") navegar(-1);
            }
        });

        let touchstartX = 0;
        let touchendX = 0;

        document.getElementById('contenedor-modal').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('contenedor-modal').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            manejarSwipe();
        }, { passive: true });

        function manejarSwipe() {
            if (tipoModalActual === 'foto') {
                if (touchendX < touchstartX - 50) navegar(1);  
                if (touchendX > touchstartX + 50) navegar(-1); 
            }
        }
    </script>
</body>
</html>
