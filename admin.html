<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Chica Americana</title>
    <style>
        :root {
            --bg-color: #0f0f10;
            --card-bg: #1a1a1e;
            --card-hover: #26262b;
            --accent-color: #2196F3;
            --accent-hover: #0b7dda;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --text-color: #f5f5f7;
            --text-muted: #a1a1a6;
            --border-color: #2d2d32;
            --radius-lg: 16px;
            --radius-sm: 10px;
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 2rem 1rem; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h2 { 
            font-weight: 600; 
            color: var(--text-color); 
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .contenedor-admin { 
            max-width: 1080px; 
            margin: 0 auto; 
        }

        .header-acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-color); 
            box-shadow: var(--shadow-lg); 
            margin-bottom: 2rem; 
        }

        .grupo-input { 
            margin-bottom: 18px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: var(--radius-sm); 
            border: 1px solid var(--border-color); 
            background-color: #121215; 
            color: var(--text-color); 
            font-size: 0.95rem; 
            transition: all 0.2s ease; 
            font-family: inherit; 
            outline: none;
        }

        input:focus, select:focus, textarea:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }
        
        .btn { 
            padding: 12px 22px; 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: all 0.2s ease; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { 
            background-color: var(--accent-hover); 
            transform: translateY(-1px);
        }

        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: var(--danger-hover); }

        /* Tarjetas de Selección de Tipo */
        .selector-tipo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-tipo {
            border: 2px solid var(--border-color);
            background: #121215;
            padding: 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .card-tipo svg { fill: var(--text-muted); transition: fill 0.2s ease; }

        .card-tipo:hover {
            border-color: rgba(33, 150, 243, 0.5);
            background: #18181c;
        }

        .card-tipo.activa {
            border-color: var(--accent-color);
            background: rgba(33, 150, 243, 0.08);
        }

        .card-tipo.activa svg { fill: var(--accent-color); }
        .card-tipo span { font-size: 0.9rem; font-weight: 600; color: var(--text-color); }

        /* Cuadrícula Adaptable Base de Datos */
        .cuadricula-db-4col { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-top: 1rem; 
        }

        @media (max-width: 900px) { .cuadricula-db-4col { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .cuadricula-db-4col { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 400px) { .cuadricula-db-4col { grid-template-columns: 1fr; } }

        .tarjeta-db { 
            background: #141417; 
            border-radius: var(--radius-sm); 
            border: 1px solid var(--border-color); 
            overflow: hidden; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: flex; 
            flex-direction: column; 
        }

        .tarjeta-db:hover { 
            transform: translateY(-3px); 
            border-color: var(--accent-color); 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); 
        }

        .tarjeta-db-img-container { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            position: relative; 
            overflow: hidden; 
        }

        .tarjeta-db-img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s ease;
        }

        .tarjeta-db:hover .tarjeta-db-img-container img { transform: scale(1.05); }

        .tarjeta-db-body { 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
            justify-content: space-between; 
            gap: 10px;
        }

        .tarjeta-db-titulo { 
            font-size: 0.95rem; 
            font-weight: 600; 
            color: var(--text-color); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        
        .badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 0.7rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: inline-block; 
            width: fit-content; 
        }

        .badge-foto { background: rgba(33, 150, 243, 0.15); color: #64b5f6; border: 1px solid rgba(33, 150, 243, 0.3); }
        .badge-video { background: rgba(156, 39, 176, 0.15); color: #ba68c8; border: 1px solid rgba(156, 39, 176, 0.3); }

        /* Modales */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(8px); 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        .modal-contenido { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 600px; 
            max-height: 90vh; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: var(--shadow-lg); 
            animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header { 
            padding: 20px 24px; 
            background: #141417; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
        }

        .modal-header h3 { 
            margin: 0; 
            font-size: 1.1rem; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cerrar-modal-btn { 
            background: none; 
            border: none; 
            color: var(--text-muted); 
            font-size: 1.5rem; 
            cursor: pointer; 
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .cerrar-modal-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .modal-body { 
            padding: 24px; 
            overflow-y: auto; 
            flex-grow: 1; 
        }

        /* Área Interactiva Drag & Drop de Imágenes */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            background: #121215;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        .drop-zone:focus-within {
            border-color: var(--accent-color);
            background: rgba(33, 150, 243, 0.03);
        }

        .cuadricula-fotos-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 12px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px;
        }

        .celda-grid { 
            aspect-ratio: 1/1; 
            background: #101012; 
            border-radius: var(--radius-sm); 
            overflow: hidden; 
            position: relative; 
            border: 1px solid var(--border-color); 
        }

        .celda-grid img { width: 100%; height: 100%; object-fit: cover; }

        .celda-grid button.borrar-foto-grid { 
            position: absolute; 
            top: 4px; 
            right: 4px; 
            background: rgba(239, 68, 68, 0.9); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 22px; 
            height: 22px; 
            font-size: 0.8rem; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background 0.2s ease; 
        }

        .celda-grid button.borrar-foto-grid:hover { background: var(--danger-color); }

        .search-box {
            position: relative;
            width: 280px;
        }
        @media (max-width: 600px) { .search-box { width: 100%; } }

        .search-box input { padding-left: 38px; }

        .search-icon-svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            pointer-events: none;
        }

        .preview-video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .preview-video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="contenedor-admin">
        <div class="header-acciones">
            <h2>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                Gestión de Portafolio
            </h2>

            <button class="btn" onclick="abrirModalCreacion()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Agregar Contenido
            </button>
        </div>

        <div class="panel" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 12px;">
                <h3 style="font-size: 1rem; color: var(--text-muted); font-weight: 500;">Contenido Activo</h3>
                <div class="search-box">
                    <svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="buscador-admin" placeholder="Buscar título..." onkeyup="filtrarRegistros()">
                </div>
            </div>
            
            <div class="cuadricula-db-4col" id="lista-admin">
                <!-- Carga dinámica -->
            </div>
        </div>
    </div>

    <!-- MODAL AGREGAR CONTENIDO (UI MEJORADA) -->
    <div id="modal-crear-nuevo" class="modal-overlay">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Agregar Nuevo Contenido
                </h3>
                <button class="cerrar-modal-btn" onclick="cerrarModalCreacion()">&times;</button>
            </div>
            <div class="modal-body">
                <label>Selecciona el tipo de publicación:</label>
                <div class="selector-tipo-grid">
                    <div class="card-tipo activa" id="card-tipo-foto" onclick="seleccionarTipoUI('foto')">
                        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        <span>Álbum de Fotos</span>
                    </div>
                    <div class="card-tipo" id="card-tipo-video" onclick="seleccionarTipoUI('video')">
                        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                        <span>Video individual</span>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="nombre">Título del Contenido</label>
                    <input type="text" id="nombre" placeholder="Ej: Colección Primavera 2026">
                </div>

                <!-- SECCIÓN FOTOS -->
                <div id="grupo-fotos">
                    <div class="drop-zone">
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">Ingresa la URL de la imagen y presiona <b>Añadir</b></div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="input-nueva-foto-url" placeholder="https://ejemplo.com/imagen.jpg" onkeydown="if(event.key==='Enter'){agregarFotoLista(); event.preventDefault();}">
                            <button type="button" class="btn" onclick="agregarFotoLista()">+ Añadir</button>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="margin:0;">Fotos preparadas (<span id="contador-fotos-creacion">0</span>)</label>
                    </div>
                    <div class="cuadricula-fotos-preview" id="cuadricula-fotos-creacion">
                        <!-- Vista previa de chips de fotos -->
                    </div>
                </div>

                <!-- SECCIÓN VIDEO -->
                <div id="grupo-video" style="display: none;">
                    <div class="grupo-input">
                        <label for="url-video">Enlace del Video</label>
                        <input type="text" id="url-video" placeholder="https://ejemplo.com/video.mp4">
                    </div>
                    <div class="grupo-input">
                        <label for="url-portada-video">Portada o Miniatura (URL Opcional)</label>
                        <input type="text" id="url-portada-video" placeholder="https://ejemplo.com/portada.jpg" oninput="actualizarPreviewVideo(this.value)">
                    </div>
                    <div class="preview-video-container" id="preview-container-video">
                        Vista previa de la miniatura
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button class="btn" style="width: 100%; padding: 14px;" onclick="guardarContenidoNuevo()">Publicar Contenido</button>
                </div>
                <p id="msg" style="text-align: center; margin-top: 12px; font-weight: 500; font-size: 0.9rem; min-height: 20px;"></p>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR / ELIMINAR REGISTRO -->
    <div id="modal-item-detalle" class="modal-overlay">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3 id="modal-item-titulo-header">Gestionar Publicación</h3>
                <button class="cerrar-modal-btn" onclick="cerrarModalItem()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modal-edit-id">
                <input type="hidden" id="modal-input-tipo">

                <div class="grupo-input">
                    <label for="modal-input-nombre">Título:</label>
                    <input type="text" id="modal-input-nombre">
                </div>

                <div id="modal-grupo-video" style="display:none;">
                    <div class="grupo-input">
                        <label for="modal-input-urlvideo">URL del Video:</label>
                        <input type="text" id="modal-input-urlvideo">
                    </div>
                    <div class="grupo-input">
                        <label for="modal-input-portada">URL de Portada:</label>
                        <input type="text" id="modal-input-portada">
                    </div>
                </div>

                <div id="modal-grupo-fotos" style="display:none;">
                    <div class="grupo-input">
                        <label>Agregar nueva foto al álbum:</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="input-edit-foto-url" placeholder="https://ejemplo.com/foto.jpg" onkeydown="if(event.key==='Enter'){agregarFotoEdicionLista(); event.preventDefault();}">
                            <button type="button" class="btn" style="white-space: nowrap;" onclick="agregarFotoEdicionLista()">+ Añadir</button>
                        </div>
                    </div>

                    <label>Imágenes actuales (<span id="modal-contador-fotos">0</span>):</label>
                    <div class="cuadricula-fotos-preview" id="cuadricula-fotos-edicion"></div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button class="btn" style="flex: 1;" onclick="guardarCambiosModal()">Guardar Cambios</button>
                    <button class="btn btn-danger" style="flex: 1;" onclick="eliminarItemModal()">Eliminar Registro</button>
                </div>
                <p id="modal-msg" style="text-align: center; margin-top: 12px; font-weight: 500; font-size: 0.9rem; min-height: 20px;"></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCd5evRX5lv8ulopShw0gJ_iCpnaMQxays", 
            authDomain: "chica-americana.firebaseapp.com", 
            projectId: "chica-americana", 
            storageBucket: "chica-americana.firebasestorage.app", 
            messagingSenderId: "20615894861", 
            appId: "1:20615894861:web:67895bcdec88371e318904" 
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        let tipoSeleccionado = 'foto';
        let listaFotosTemporal = []; 
        let listaFotosEdicionTemporal = [];
        let registrosGlobales = [];

        // Selección Interactiva de Tipo
        window.seleccionarTipoUI = function(tipo) {
            tipoSeleccionado = tipo;
            document.getElementById('card-tipo-foto').classList.toggle('activa', tipo === 'foto');
            document.getElementById('card-tipo-video').classList.toggle('activa', tipo === 'video');

            if(tipo === 'foto') {
                document.getElementById('grupo-video').style.display = 'none';
                document.getElementById('grupo-fotos').style.display = 'block';
            } else {
                document.getElementById('grupo-video').style.display = 'block';
                document.getElementById('grupo-fotos').style.display = 'none';
            }
        }

        window.abrirModalCreacion = function() {
            document.getElementById('modal-crear-nuevo').style.display = 'flex';
            document.getElementById('msg').innerText = '';
        }

        window.cerrarModalCreacion = function() {
            document.getElementById('modal-crear-nuevo').style.display = 'none';
            document.getElementById('nombre').value = '';
            document.getElementById('url-video').value = '';
            document.getElementById('url-portada-video').value = '';
            document.getElementById('input-nueva-foto-url').value = '';
            document.getElementById('preview-container-video').innerHTML = 'Vista previa de la miniatura';
            listaFotosTemporal = [];
            renderizarFotosCreacion();
        }

        window.actualizarPreviewVideo = function(url) {
            const container = document.getElementById('preview-container-video');
            if(url.trim()) {
                container.innerHTML = `<img src="${url}" onerror="this.parentNode.innerHTML='URL de imagen no válida'">`;
            } else {
                container.innerHTML = 'Vista previa de la miniatura';
            }
        }

        // Fotos Creación
        window.agregarFotoLista = function() {
            const input = document.getElementById('input-nueva-foto-url');
            const url = input.value.trim();
            if(url) {
                listaFotosTemporal.push(url);
                input.value = '';
                renderizarFotosCreacion();
            }
        }

        window.eliminarFotoTemporal = function(index) {
            listaFotosTemporal.splice(index, 1);
            renderizarFotosCreacion();
        }

        function renderizarFotosCreacion() {
            const grid = document.getElementById('cuadricula-fotos-creacion');
            document.getElementById('contador-fotos-creacion').innerText = listaFotosTemporal.length;
            
            if(listaFotosTemporal.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 15px 0;">Aún no agregas fotos al álbum.</div>`;
                return;
            }

            grid.innerHTML = '';
            listaFotosTemporal.forEach((url, index) => {
                const celda = document.createElement('div');
                celda.className = 'celda-grid';
                celda.innerHTML = `
                    <img src="${url}" onerror="this.src='https://via.placeholder.com/150/1a1a1e/ffffff?text=Error'">
                    <button class="borrar-foto-grid" onclick="eliminarFotoTemporal(${index})">&times;</button>
                `;
                grid.appendChild(celda);
            });
        }

        // Firestore Realtime Listener
        onSnapshot(collection(db, "multimedia"), (snapshot) => {
            registrosGlobales = [];
            snapshot.forEach((docSnap) => {
                registrosGlobales.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderizarCuadriculaAdmin(registrosGlobales);
        });

        function renderizarCuadriculaAdmin(datos) {
            const container = document.getElementById('lista-admin');
            container.innerHTML = '';
            
            if(datos.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; color:var(--text-muted); padding: 40px 0;">No hay elementos guardados.</div>`;
                return;
            }

            datos.forEach((item) => {
                let miniatura = '';
                let badgeClass = item.tipo === 'foto' ? 'badge-foto' : 'badge-video';
                let tipoTexto = item.tipo === 'foto' ? 'Álbum' : 'Video';

                if(item.tipo === 'foto') {
                    const primeraFoto = Array.isArray(item.url) ? item.url[0] : item.url;
                    miniatura = `<img src="${primeraFoto}" onerror="this.src='https://via.placeholder.com/300x170/1a1a1e/ffffff?text=Sin+Imagen'">`;
                } else {
                    const miniaturaVideo = item.portada || 'https://via.placeholder.com/300x170/1a1a1e/ffffff?text=Video';
                    miniatura = `<img src="${miniaturaVideo}" onerror="this.src='https://via.placeholder.com/300x170/1a1a1e/ffffff?text=Video'">`;
                }

                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-db';
                tarjeta.onclick = () => abrirModalItem(item);
                tarjeta.innerHTML = `
                    <div class="tarjeta-db-img-container">${miniatura}</div>
                    <div class="tarjeta-db-body">
                        <div>
                            <span class="badge ${badgeClass}" style="margin-bottom: 8px;">${tipoTexto}</span>
                            <div class="tarjeta-db-titulo" title="${item.nombre || 'Sin título'}">${item.nombre || 'Sin título'}</div>
                        </div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); text-align: right;">Editar / Eliminar</div>
                    </div>
                `;
                container.appendChild(tarjeta);
            });
        }

        window.filtrarRegistros = function() {
            const textoBusqueda = document.getElementById('buscador-admin').value.toLowerCase().trim();
            const filtrados = registrosGlobales.filter(item => (item.nombre || '').toLowerCase().includes(textoBusqueda));
            renderizarCuadriculaAdmin(filtrados);
        }

        // Publicar Registro
        window.guardarContenidoNuevo = async function() {
            const nombre = document.getElementById('nombre').value.trim();
            const msg = document.getElementById('msg');

            let datosAGuardar = "";
            let portadaVideo = "";

            if(tipoSeleccionado === 'foto') {
                if(listaFotosTemporal.length === 0) {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Agrega al menos una foto al álbum.";
                    return;
                }
                datosAGuardar = listaFotosTemporal;
            } else {
                const urlVideo = document.getElementById('url-video').value.trim();
                portadaVideo = document.getElementById('url-portada-video').value.trim();
                if(!urlVideo) {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Ingresa la URL del video.";
                    return;
                }
                datosAGuardar = urlVideo;
            }

            try {
                msg.style.color = "var(--text-muted)";
                msg.innerText = "Publicando...";

                const objetoDatos = {
                    tipo: tipoSeleccionado,
                    nombre: nombre || "Sin título",
                    url: datosAGuardar,
                    fecha: new Date()
                };

                if(tipoSeleccionado === 'video') objetoDatos.portada = portadaVideo;

                await addDoc(collection(db, "multimedia"), objetoDatos);
                msg.style.color = "#22c55e";
                msg.innerText = "¡Publicación realizada!";

                setTimeout(() => cerrarModalCreacion(), 1000);
            } catch(e) {
                console.error(e);
                msg.style.color = "#ef4444";
                msg.innerText = "Error al conectar con la base de datos.";
            }
        }

        // Editar
        window.abrirModalItem = function(item) {
            document.getElementById('modal-edit-id').value = item.id;
            document.getElementById('modal-input-tipo').value = item.tipo;
            document.getElementById('modal-input-nombre').value = item.nombre || '';
            document.getElementById('modal-msg').innerText = '';

            if(item.tipo === 'foto') {
                document.getElementById('modal-grupo-video').style.display = 'none';
                document.getElementById('modal-grupo-fotos').style.display = 'block';
                listaFotosEdicionTemporal = Array.isArray(item.url) ? [...item.url] : [item.url];
                renderizarFotosEdicion();
            } else {
                document.getElementById('modal-grupo-video').style.display = 'block';
                document.getElementById('modal-grupo-fotos').style.display = 'none';
                document.getElementById('modal-input-urlvideo').value = item.url || '';
                document.getElementById('modal-input-portada').value = item.portada || '';
            }

            document.getElementById('modal-item-titulo-header').innerText = `Editar ${item.tipo === 'foto' ? 'Álbum' : 'Video'}`;
            document.getElementById('modal-item-detalle').style.display = 'flex';
        }

        window.cerrarModalItem = function() {
            document.getElementById('modal-item-detalle').style.display = 'none';
        }

        window.agregarFotoEdicionLista = function() {
            const input = document.getElementById('input-edit-foto-url');
            const url = input.value.trim();
            if(url) {
                listaFotosEdicionTemporal.push(url);
                input.value = '';
                renderizarFotosEdicion();
            }
        }

        window.eliminarFotoEdicionTemporal = function(index) {
            listaFotosEdicionTemporal.splice(index, 1);
            renderizarFotosEdicion();
        }

        function renderizarFotosEdicion() {
            const grid = document.getElementById('cuadricula-fotos-edicion');
            document.getElementById('modal-contador-fotos').innerText = listaFotosEdicionTemporal.length;

            if(listaFotosEdicionTemporal.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 15px 0;">Álbum vacío.</div>`;
                return;
            }

            grid.innerHTML = '';
            listaFotosEdicionTemporal.forEach((url, index) => {
                const celda = document.createElement('div');
                celda.className = 'celda-grid';
                celda.innerHTML = `
                    <img src="${url}" onerror="this.src='https://via.placeholder.com/150/1a1a1e/ffffff?text=Error'">
                    <button class="borrar-foto-grid" onclick="eliminarFotoEdicionTemporal(${index})">&times;</button>
                `;
                grid.appendChild(celda);
            });
        }

        window.guardarCambiosModal = async function() {
            const id = document.getElementById('modal-edit-id').value;
            const tipo = document.getElementById('modal-input-tipo').value;
            const nombre = document.getElementById('modal-input-nombre').value.trim();
            const msg = document.getElementById('modal-msg');

            let datosActualizados = {};

            if(tipo === 'foto') {
                if(listaFotosEdicionTemporal.length === 0) {
                    msg.style.color = "#ef4444";
                    msg.innerText = "El álbum no puede quedar vacío.";
                    return;
                }
                datosActualizados = { nombre: nombre || "Sin título", url: listaFotosEdicionTemporal };
            } else {
                const urlVideo = document.getElementById('modal-input-urlvideo').value.trim();
                const portadaVideo = document.getElementById('modal-input-portada').value.trim();
                if(!urlVideo) {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Ingresa la URL del video.";
                    return;
                }
                datosActualizados = { nombre: nombre || "Sin título", url: urlVideo, portada: portadaVideo };
            }

            try {
                msg.style.color = "var(--text-muted)";
                msg.innerText = "Guardando cambios...";
                await updateDoc(doc(db, "multimedia", id), datosActualizados);
                msg.style.color = "#22c55e";
                msg.innerText = "¡Cambios guardados!";
                setTimeout(() => cerrarModalItem(), 1000);
            } catch(e) {
                console.error(e);
                msg.style.color = "#ef4444";
                msg.innerText = "Error al actualizar.";
            }
        }

        window.eliminarItemModal = async function() {
            const id = document.getElementById('modal-edit-id').value;
            if(confirm("¿Eliminar este contenido permanentemente?")) {
                try {
                    await deleteDoc(doc(db, "multimedia", id));
                    cerrarModalItem();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarModalCreacion();
                cerrarModalItem();
            }
        });
    </script>
</body>
</html>
